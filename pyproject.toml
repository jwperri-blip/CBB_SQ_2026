[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbbsq"
version = "0.1.0"
description = "Log, track and analyze college basketball ShotQuality (SQ) data from the ShotQuality ScoreCenter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.45",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cbbsq = "cbbsq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbbsq = ["*.js", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
