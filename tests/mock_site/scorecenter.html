<!doctype html>
<!-- Test double for the ShotQuality CBB ScoreCenter. Mirrors the visual layout of the
     real page but NOT its markup: cards alternate between two different DOM structures
     so the tests prove the extractor relies on layout, not class names. -->
<html>
<head>
<meta charset="utf-8">
<title>ScoreCenter (mock)</title>
<style>
  body { background:#0b0d12; color:#e8e8e8; font-family: system-ui, sans-serif; margin:0; }
  header { display:flex; justify-content:space-between; padding:12px 20px; border-bottom:1px solid #222; }
  h1 { color:#f26b1d; text-align:center; font-size:40px; margin:16px 0; }
  .tabs { display:flex; justify-content:center; gap:24px; }
  .tabs span.on { background:#f26b1d; padding:6px 14px; border-radius:6px; }
  .toolbar { display:flex; gap:12px; padding:16px 20px; position:relative; }
  .toolbar button, .toolbar input { background:#0b0d12; color:#e8e8e8; border:1px solid #333; border-radius:6px; padding:8px 14px; font-size:18px; }
  .count { text-align:center; color:#aaa; margin:12px 0 20px; }
  .grid { display:grid; grid-template-columns: repeat(3, 540px); gap:36px; justify-content:center; padding-bottom:40px; }
  .card { background:#151821; border:1px solid #2a2e38; border-radius:14px; padding:12px; }
  .status { text-align:center; color:#9aa; }
  .status.live { color:#2ecc40; }
  .teams { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 0 16px; border-bottom:1px solid #2a2e38; }
  .team { width:44%; text-align:center; font-weight:600; font-size:19px; }
  .team img { width:48px; height:48px; display:block; margin:0 auto 4px; background:#333; border-radius:50%; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; font-size:19px; }
  .orange { color:#f26b1d; }
  .gauge { width:48px; height:48px; border-radius:50%; border:3px solid #f2b01d; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .section { text-align:center; border-top:1px solid #2a2e38; padding:10px 0; }
  .section h4 { margin:4px 0 8px; font-size:19px; }
  .chip { display:inline-block; background:#232733; border-radius:6px; padding:6px 10px; margin:0 3px; font-size:16px; }
  .cols { display:grid; grid-template-columns: 1fr 2fr 1fr; padding:0 10px; font-size:19px; line-height:28px; }
  .cols .l { text-align:left; } .cols .c { text-align:center; color:#9aa; } .cols .r { text-align:right; }
  /* calendar popup (react-day-picker-like) */
  .popover { position:absolute; top:60px; left:20px; background:#151821; border:1px solid #333; border-radius:8px; padding:10px; z-index:5; }
  .popover .cap { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:6px; }
  .popover table { border-collapse:collapse; }
  .popover td button { width:34px; height:30px; background:none; color:#e8e8e8; border:none; }
  .popover td button.day-outside { color:#555; }
</style>
</head>
<body>
<header><strong>SHOTQUALITY</strong><button id="logout">Logout</button></header>
<h1>ScoreCenter</h1>
<div class="tabs"><span class="on">All Games</span><span>Live</span><span>Halftime</span><span>Scheduled</span><span>Final</span></div>
<div class="toolbar" id="toolbar"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<script>
const params = new URLSearchParams(location.search);
const token = localStorage.getItem('sq_token');
if (!token) location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search));
const picker = params.get('picker') || 'calendar';
let current = params.get('date') || '2026-01-10';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const mdy = (iso) => { const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; };
const pad = (n) => String(n).padStart(2, '0');
const el = (tag, attrs = {}, ...kids) => {
  const e = tag === 'svg' || tag === 'text' || tag === 'circle' ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
};
const fmt = (v, d = 2) => v == null ? '-' : Number(v).toFixed(d);

function renderToolbar() {
  const bar = document.getElementById('toolbar');
  const keep = picker === 'shadcn' ? bar.querySelector('.popover') : null;  // shadcn popup survives a pick
  bar.innerHTML = '';
  if (picker === 'input') {
    const inp = el('input', {type: 'text', value: mdy(current), 'aria-label': 'Date'});
    inp.value = mdy(current);
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const m = inp.value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (m) { current = `${m[3]}-${m[1]}-${m[2]}`; load(); }
    });
    bar.append(inp);
  } else {
    // picker=shadcn mimics the real site's shadcn/ui calendar: Tailwind classes such as
    // "bg-background" on every button, and a trigger that toggles the popup shut
    const cls = picker === 'shadcn' ? {class: 'inline-flex border bg-background hover:bg-accent'} : {};
    const btn = el('button', {type: 'button', 'aria-haspopup': 'dialog', ...cls}, el('span', {}, '\u{1F4C5} '), mdy(current));
    btn.addEventListener('click', () => {
      const open = bar.querySelector('.popover');
      if (open && picker === 'shadcn') open.remove(); else openCalendar(bar);
    });
    bar.append(btn);
  }
  bar.append(el('input', {type: 'text', placeholder: 'Search by Team'}));
  if (keep) bar.append(keep);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.popover').forEach((p) => p.remove());
});

function openCalendar(bar) {
  let [y, m] = current.split('-').map(Number);
  const pop = el('div', {class: 'popover', role: 'dialog'});
  const draw = () => {
    pop.innerHTML = '';
    const shadcn = picker === 'shadcn';
    const prev = shadcn
      ? el('button', {class: 'rdp-button_previous border bg-background', 'aria-label': 'Go to the Previous Month'}, '<')
      : el('button', {name: 'previous-month', 'aria-label': 'Go to previous month'}, '<');
    const next = shadcn
      ? el('button', {class: 'rdp-button_next border bg-background', 'aria-label': 'Go to the Next Month'}, '>')
      : el('button', {name: 'next-month', 'aria-label': 'Go to next month'}, '>');
    prev.onclick = () => { m -= 1; if (m < 1) { m = 12; y -= 1; } draw(); };
    next.onclick = () => { m += 1; if (m > 12) { m = 1; y += 1; } draw(); };
    pop.append(el('div', {class: 'cap'}, prev, el('div', {role: 'presentation'}, `${MONTHS[m - 1]} ${y}`), next));
    const table = el('table', {role: 'grid'});
    const first = new Date(Date.UTC(y, m - 1, 1));
    const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
    for (let w = 0; w < 6; w++) {
      const tr = el('tr');
      for (let i = 0; i < 7; i++) {
        const day = new Date(start); day.setUTCDate(start.getUTCDate() + w * 7 + i);
        const inMonth = day.getUTCMonth() === m - 1;
        const b = el('button', {name: 'day', role: 'gridcell', class: inMonth ? 'day' : 'day day-outside'}, String(day.getUTCDate()));
        const iso = `${day.getUTCFullYear()}-${pad(day.getUTCMonth() + 1)}-${pad(day.getUTCDate())}`;
        b.onclick = () => {
          current = iso;
          if (picker === 'shadcn') draw(); else pop.remove();  // shadcn: popup stays open, days re-render
          load();
        };
        tr.append(el('td', {role: 'presentation'}, b));
      }
      table.append(tr);
    }
    pop.append(table);
  };
  draw();
  bar.append(pop);
}

function gauge(v, svg) {
  if (v == null) return el('span', {}, '');
  if (!svg) return el('div', {class: 'gauge'}, String(v));
  return el('svg', {width: 52, height: 52, viewBox: '0 0 52 52'},
    el('circle', {cx: 26, cy: 26, r: 22, fill: 'none', stroke: '#f2b01d', 'stroke-width': 3}),
    el('text', {x: 26, y: 31, 'text-anchor': 'middle', fill: '#e8e8e8', 'font-size': 16}, String(v)));
}

function teamBlock(t, abbr) {
  return el('div', {class: 'team'}, el('img', {src: `/logos/${abbr}.png`, alt: t.name}), t.name);
}

function cardA(g) {  // row-major: each row is [away value][label][home value]
  const a = g.away, h = g.home;
  const row = (av, label, hv, cls = '') => el('div', {class: 'row'}, el('span', {}, av), el('span', {class: cls}, label), el('span', {}, hv));
  const chips = (obj, isLine) => ['pre', 'cur'].filter((k) => obj && obj[k]).map((k) =>
    el('span', {class: 'chip'}, `${k === 'pre' ? 'Pre-Game' : 'Current'} ${obj[k]}`));
  return el('div', {class: 'card'},
    el('div', {class: 'status' + (g.status === 'Live' ? ' live' : '')}, g.status, ...(g.detail ? [el('div', {}, g.detail)] : [])),
    el('div', {class: 'teams'}, teamBlock(a, 'a'), teamBlock(h, 'h')),
    row(a.score ?? '-', 'Score', h.score ?? '-'),
    row(fmt(a.sq, 1), 'SQ Score', fmt(h.sq, 1), 'orange'),
    el('div', {class: 'row'}, gauge(a.pct, false), el('span', {}, 'SQ Percentile'), gauge(h.pct, false)),
    el('div', {class: 'section'}, el('h4', {}, 'PTS / Possession'),
      row(fmt(a.ppp), 'Live', fmt(h.ppp)), row(fmt(a.sqppp), 'Live SQ', fmt(h.sqppp)), row(fmt(a.pre), 'Pregame SQ', fmt(h.pre))),
    el('div', {class: 'section'}, el('h4', {}, 'Game Line'), ...chips(g.line)),
    el('div', {class: 'section'}, el('h4', {}, 'Over / Under'), ...chips(g.ou)));
}

function cardB(g) {  // column-major PPP block, split labels, SVG gauges, multi-span chips
  const a = g.away, h = g.home;
  const trio = (av, label, hv) => el('div', {class: 'row'}, el('b', {}, av), label, el('b', {}, hv));
  const chips = (obj) => ['pre', 'cur'].filter((k) => obj && obj[k]).map((k) =>
    el('span', {class: 'chip'}, el('span', {}, k === 'pre' ? 'Pre-Game' : 'Current'), ' ', el('span', {}, obj[k])));
  return el('section', {class: 'card'},
    el('p', {class: 'status' + (g.status === 'Live' ? ' live' : '')}, el('span', {}, g.status)),
    ...(g.detail ? [el('p', {class: 'status', style: 'margin-top:-12px'}, g.detail)] : []),
    el('div', {class: 'teams'}, teamBlock(a, 'a'), teamBlock(h, 'h')),
    trio(String(a.score ?? '-'), el('span', {}, 'Score'), String(h.score ?? '-')),
    trio(fmt(a.sq, 1), el('span', {class: 'orange'}, el('span', {}, 'SQ'), ' ', el('span', {}, 'Score')), fmt(h.sq, 1)),
    el('div', {class: 'row'}, gauge(a.pct, true), el('span', {}, 'SQ Percentile'), gauge(h.pct, true)),
    el('div', {class: 'section'}, el('h4', {}, 'PTS / Possession'),
      el('div', {class: 'cols'},
        el('div', {class: 'l'}, ...[a.ppp, a.sqppp, a.pre].map((v) => el('div', {}, fmt(v)))),
        el('div', {class: 'c'}, ...['Live', 'Live SQ', 'Pregame SQ'].map((t) => el('div', {}, t))),
        el('div', {class: 'r'}, ...[h.ppp, h.sqppp, h.pre].map((v) => el('div', {}, fmt(v)))))),
    el('div', {class: 'section'}, el('h4', {}, 'Game Line'), ...chips(g.line)),
    el('div', {class: 'section'}, el('h4', {}, 'Over / Under'), ...chips(g.ou)));
}

async function load() {
  renderToolbar();
  history.replaceState(null, '', `?date=${current}` + (picker !== 'calendar' ? `&picker=${picker}` : ''));
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const slow = picker === 'shadcn';  // like the real site: old cards vanish, new ones arrive late, count last
  if (slow) { grid.innerHTML = ''; await new Promise((r) => setTimeout(r, 1200)); }
  const res = await fetch(`/api/cbb/scorecenter?date=${current}`, {headers: {Authorization: 'Bearer ' + token}});
  if (res.status === 401) { localStorage.removeItem('sq_token'); location.replace('/login'); return; }
  const games = (await res.json()).games;
  await new Promise((r) => setTimeout(r, slow ? +(params.get('lag') || 1200) : 150));  // simulate render latency
  if (!slow) count.textContent = `Showing ${games.length} of ${games.length} games`;
  grid.innerHTML = '';
  games.forEach((g, i) => grid.append(i % 2 ? cardB(g) : cardA(g)));
  if (slow) { await new Promise((r) => setTimeout(r, 1200)); count.textContent = `Showing ${games.length} of ${games.length} games`; }
}
document.getElementById('logout').onclick = () => { localStorage.removeItem('sq_token'); location.replace('/login'); };
if (token) load();
</script>
</body>
</html>
